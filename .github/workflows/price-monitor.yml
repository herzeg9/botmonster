# Monitor de preços — execução agendada e manual
name: Price monitor

on:
  schedule:
    # A cada 2 horas (minuto 0)
    - cron: "0 */2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: price-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Dependências Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Playwright Chromium (com deps de sistema)
        run: python -m playwright install --with-deps chromium

      - name: Executar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit e push do histórico (se alterado)
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ ! -f historico_precos.json ]; then
            echo "historico_precos.json não existe; nada a versionar."
            exit 0
          fi
          git add historico_precos.json
          if git diff --staged --quiet; then
            echo "historico_precos.json sem alterações."
          else
            git commit -m "chore: atualiza historico_precos.json [skip ci]"
            git push origin HEAD:main
          fi
